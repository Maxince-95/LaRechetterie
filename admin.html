  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

         <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E8E4;border-radius:18px;padding:16px 18px 8px\">\n            <h2 style=\"font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px\">Matières les plus suivies<\u002Fh2>\n            <sc-for list=\"{{ suivis }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid #EDF0EC\">\n                <span style=\"flex:none;width:150px;font-size:14px;font-weight:600;letter-spacing:-.01em\">{{ s.nom }}<\u002Fspan>\n                <div style=\"flex:1;height:8px;border-radius:100px;background:#EDF0EC;overflow:hidden\">\n                  <div style=\"height:100%;width:{{ s.largeur }};background:#1E4A3A;border-radius:100px\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"flex:none;width:56px;text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums\">{{ s.nb }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #E4E8E4;border-radius:18px;padding:16px 18px 18px\">\n            <h2 style=\"font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px\">Langue de l'app<\u002Fh2>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <sc-for list=\"{{ langues }}\" as=\"l\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1;min-width:104px;background:#FBFCFB;border:1px solid #EDF0EC;border-radius:14px;padding:12px 14px\">\n                  <div style=\"font-size:13px;color:#6C7871\">{{ l.nom }}<\u002Fdiv>\n                  <div style=\"font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums\">{{ l.part }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ estHoraires }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:620px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid #E4E8E4;border-radius:18px;padding:8px 18px\">\n            <sc-for list=\"{{ horaires }}\" as=\"h\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid #EDF0EC\">\n                <span style=\"flex:1;min-width:96px;font-size:14.5px;font-weight:600;letter-spacing:-.015em\">{{ h.jour }}<\u002Fspan>\n                <sc-if value=\"{{ h.ouvert }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <input type=\"text\" value=\"{{ h.de }}\" sc-camel-on-change=\"{{ h.majDe }}\" style=\"width:74px;height:38px;border:1px solid #DCE1DD;border-radius:10px;padding:0 10px;font-size:14px;text-align:center;background:#FBFCFB;font-variant-numeric:tabular-nums\">\n                    <span style=\"color:#9AA5A0\">–<\u002Fspan>\n                    <input type=\"text\" value=\"{{ h.a }}\" sc-camel-on-change=\"{{ h.majA }}\" style=\"width:74px;height:38px;border:1px solid #DCE1DD;border-radius:10px;padding:0 10px;font-size:14px;text-align:center;background:#FBFCFB;font-variant-numeric:tabular-nums\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ h.ferme }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:13.5px;color:#A6362E;font-weight:600\">Fermé<\u002Fspan>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ h.basculer }}\" style=\"cursor:pointer;height:36px;padding:0 13px;border:1px solid #DCE1DD;border-radius:10px;background:#fff;color:#41504A;font-size:13px;font-weight:600\">{{ h.action }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ enregistrerHoraires }}\" style=\"cursor:pointer;align-self:flex-start;height:44px;padding:0 18px;border:0;border-radius:12px;background:#1E4A3A;color:#fff;font-size:14.5px;font-weight:600\">Enregistrer les horaires<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ estJournal }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #E4E8E4;border-radius:18px;padding:6px 18px 12px;max-width:760px\">\n          <sc-if value=\"{{ sansJournal }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:13.5px;color:#8B958F;padding:14px 0\">Aucune action enregistrée.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ journal }}\" as=\"j\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EDF0EC\">\n              <span style=\"flex:none;width:9px;height:9px;border-radius:100px;background:{{ j.couleur }};margin-top:6px\"><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;letter-spacing:-.01em\">{{ j.quoi }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8B958F;margin-top:2px\">{{ j.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;font-size:12.5px;color:#9AA5A0;white-space:nowrap\">{{ j.quand }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ estCompte }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:460px;background:#fff;border:1px solid #E4E8E4;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:13px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#41504A\">Identifiant<\u002Fspan>\n            <input type=\"text\" value=\"{{ cptId }}\" sc-camel-on-change=\"{{ majCptId }}\" style=\"height:44px;border:1px solid #DCE1DD;border-radius:12px;padding:0 13px;font-size:15px;background:#FBFCFB\">\n          <\u002Flabel>\n\n          <div style=\"height:1px;background:#EDF0EC;margin:2px 0\"><\u002Fdiv>\n\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#41504A\">Mot de passe actuel<\u002Fspan>\n            <input type=\"password\" value=\"{{ cptActuel }}\" sc-camel-on-change=\"{{ majCptActuel }}\" placeholder=\"••••••••\" style=\"height:44px;border:1px solid #DCE1DD;border-radius:12px;padding:0 13px;font-size:15px;background:#FBFCFB\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#41504A\">Nouveau mot de passe<\u002Fspan>\n            <input type=\"password\" value=\"{{ cptNouveau }}\" sc-camel-on-change=\"{{ majCptNouveau }}\" placeholder=\"6 caractères minimum\" style=\"height:44px;border:1px solid #DCE1DD;border-radius:12px;padding:0 13px;font-size:15px;background:#FBFCFB\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#41504A\">Confirmer<\u002Fspan>\n            <input type=\"password\" value=\"{{ cptConfirme }}\" sc-camel-on-change=\"{{ majCptConfirme }}\" placeholder=\"••••••••\" style=\"height:44px;border:1px solid #DCE1DD;border-radius:12px;padding:0 13px;font-size:15px;background:#FBFCFB\">\n          <\u002Flabel>\n\n          <sc-if value=\"{{ aCptMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;font-weight:500;color:{{ cptCouleur }}\">{{ cptMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <button sc-camel-on-click=\"{{ enregistrerCompte }}\" style=\"cursor:pointer;align-self:flex-start;height:44px;padding:0 18px;border:0;border-radius:12px;background:#1E4A3A;color:#fff;font-size:14.5px;font-weight:600\">Enregistrer<\u002Fbutton>\n          <p style=\"margin:0;font-size:12.5px;color:#8B958F;line-height:1.5\">Laisser les champs mot de passe vides pour ne modifier que l'identifiant.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ aToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#141A16;color:#fff;font-size:14px;font-weight:500;padding:12px 18px;border-radius:100px;box-shadow:0 12px 30px rgba(20,26,22,.28);z-index:40\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst C = {\n  vert: '#1E4A3A', menthe: '#E2EDE6', rouge: '#A6362E', doux: '#F5F7F4',\n  a900: '#141A16', a700: '#41504A', a500: '#6C7871', a300: '#9AA5A0', bord: '#DCE1DD'\n};\n\nconst MATIERES = [\n  { id: 'cu-rigide-rouge', cat: 'cuivre', court: 'Cuivre rouge', nom: 'Cuivre élec dénudé : rigide rouge', prix: 10.10 },\n  { id: 'cu-rigide', cat: 'cuivre', court: 'Cuivre rigide', nom: 'Cuivre élec dénudé : rigide pas rouge', prix: 9.20 },\n  { id: 'cu-souple', cat: 'cuivre', court: 'Cuivre souple', nom: 'Cuivre élec dénudé : souple', prix: 9.20 },\n  { id: 'cu-meplat', cat: 'cuivre', court: 'Méplat', nom: 'Cuivre élec : méplat rouge', prix: 9.20 },\n  { id: 'cu-mele', cat: 'cuivre', court: 'Cuivre mêlé', nom: 'Tuyaux, bobinage, objets', prix: 9.00 },\n  { id: 'cu-chauffe', cat: 'cuivre', court: 'Corps de chauffe', nom: 'Cuivre corps de chauffe étamé', prix: 6.70 },\n  { id: 'cable-elec', cat: 'cable', court: 'Câble élec', nom: 'Câble cuivre électrique', prix: 3.00 },\n  { id: 'cable-info', cat: 'cable', court: 'Câble info', nom: 'Câble cuivre informatique', prix: 2.50 },\n  { id: 'cable-arme', cat: 'cable', court: 'Câble armé', nom: 'Câble cuivre armé ferré sans plomb', prix: 1.30 },\n  { id: 'cable-arme-pb', cat: 'cable', court: 'Câble armé Pb', nom: 'Câble cuivre armé ferré avec plomb', prix: 0.30 },\n  { id: 'cable-alu', cat: 'cable', court: 'Câble alu', nom: 'Câble aluminium', prix: 0.50 },\n  { id: 'laiton', cat: 'laiton', court: 'Laiton', nom: 'Laiton', prix: 4.90 },\n  { id: 'compteur', cat: 'laiton', court: 'Compteur', nom: 'Compteur en laiton', prix: 1.50 },\n  { id: 'alu', cat: 'alu', court: 'Alu', nom: 'Aluminium', prix: 1.00 },\n  { id: 'rad-alu', cat: 'alu', court: 'Radiateur alu', nom: 'Radiateur aluminium', prix: 0.40 },\n  { id: 'rad-alu-cu', cat: 'alu', court: 'Radiateur mixte', nom: 'Radiateur aluminium et cuivre', prix: 2.00 },\n  { id: 'plomb', cat: 'autres', court: 'Plomb', nom: 'Plomb', prix: 1.00 },\n  { id: 'zinc', cat: 'autres', court: 'Zinc', nom: 'Zinc', prix: 1.40 },\n  { id: 'inox', cat: 'autres', court: 'Inox', nom: 'Inox', prix: 0.50 },\n  { id: 'ferraille', cat: 'autres', court: 'Ferrailles', nom: 'Ferrailles', prix: 0.10 },\n  { id: 'batterie', cat: 'autres', court: 'Batteries', nom: 'Batterie plomb ou lithium', prix: null }\n];\n\nconst FILTRES = [\n  { id: 'tous', nom: 'Tout' }, { id: 'cuivre', nom: 'Cuivre' }, { id: 'cable', nom: 'Câbles' },\n  { id: 'laiton', nom: 'Laiton' }, { id: 'alu', nom: 'Alu' }, { id: 'autres', nom: 'Autres' }\n];\n\nconst SECTIONS = [\n  { id: 'bareme', nom: 'Barème', eyebrow: 'Tarifs', titre: 'Barème des prix' },\n  { id: 'notifs', nom: 'Notifications', eyebrow: 'Diffusion', titre: 'Notifications clients' },\n  { id: 'annonces', nom: 'Annonces', eyebrow: 'Diffusion', titre: 'Annonce dans l\\u2019app' },\n  { id: 'histo', nom: 'Historique', eyebrow: 'Tarifs', titre: 'Historique 6 mois' },\n  { id: 'clients', nom: 'Clients', eyebrow: 'Audience', titre: 'Clients abonnés' },\n  { id: 'horaires', nom: 'Horaires', eyebrow: 'Site', titre: 'Horaires d\\u2019ouverture' },\n  { id: 'journal', nom: 'Journal', eyebrow: 'Suivi', titre: 'Journal des modifications' },\n  { id: 'compte', nom: 'Compte', eyebrow: 'Accès', titre: 'Compte administrateur' }\n];\n\nconst MODELES = [\n  { id: 'fermeture', type: 'fermeture', nom: 'Fermeture annuelle', titre: 'Fermeture annuelle',\n    texte: 'Fermé du 2 au 30 août. Réouverture le lundi 31 août à 8h.' },\n  { id: 'horaires', type: 'info', nom: 'Horaires exceptionnels', titre: 'Horaires exceptionnels',\n    texte: \"Samedi 15 : fermeture à 12h. Dépôts jusqu'à 11h30.\" },\n  { id: 'prix', type: 'info', nom: 'Nouveaux prix', titre: 'Nouveaux prix',\n    texte: 'Barème mis à jour ce matin. Cuivre en hausse.' },\n  { id: 'paiements', type: 'info', nom: 'Paiements', titre: 'Paiements',\n    texte: 'Arrivé avant 12h / paiement à 12h30\\nLe reste de la journée / paiement à 18h30' }\n];\n\nconst TYPES = [\n  { id: 'fermeture', nom: 'Alerte', couleur: '#A6362E' },\n  { id: 'info', nom: 'Info', couleur: '#1E4A3A' },\n  { id: 'neutre', nom: 'Neutre', couleur: '#6C7871' }\n];\n\nconst JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];\nconst MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];\n\nconst eur = n => n.toFixed(2).replace('.', ',');\nconst hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973; return h; };\nconst abonnes = id => 12 + (hash(id) % 88);\n\nconst heureFr = d => d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');\nconst dateFr = d => d.getDate() + ' ' + MOIS_COURT[d.getMonth()] + ' ' + heureFr(d);\n\nclass Component extends DCLogic {\n  state = {\n    session: false, champId: '', champMdp: '', erreur: '',\n    section: 'bareme', large: true,\n    prix: MATIERES.reduce((a, m) => { a[m.id] = m.prix; return a; }, {}),\n    delta: {},\n    brouillonsPrix: {},\n    recherche: '', filtre: 'tous',\n    notifs: [], envoyees: [],\n    apercu: null,\n    composeTitre: '', composeTexte: '',\n    annonce: { actif: true, type: 'fermeture', modele: 'fermeture', titre: '', texte: '' },\n    horaires: JOURS.map((j, i) => ({ jour: j, ouvert: i < 6, de: i === 5 ? '08:00' : '08:00', a: i === 5 ? '12:00' : '17:30' })),\n    journal: [],\n    histoMatiere: 'cu-rigide-rouge',\n    identifiant: 'bernard@larechetterie.fr',\n    motdepasse: 'rechetterie',\n    cptId: 'bernard@larechetterie.fr', cptActuel: '', cptNouveau: '', cptConfirme: '', cptMsg: '', cptErreur: false,\n    toast: ''\n  };\n\n  componentDidMount() {\n    this.mesurer();\n    window.addEventListener('resize', this.mesurer);\n    try {\n      const brut = localStorage.getItem('lr-admin');\n      if (brut) {\n        const e = JSON.parse(brut);\n        this.setState(s => ({\n          prix: e.prix || s.prix, delta: e.delta || s.delta,\n          envoyees: e.envoyees || [], journal: e.journal || [],\n          horaires: e.horaires || s.horaires, annonce: e.annonce || s.annonce,\n          identifiant: e.identifiant || s.identifiant,\n          motdepasse: e.motdepasse || s.motdepasse,\n          cptId: e.identifiant || s.identifiant\n        }));\n      }\n      const an = localStorage.getItem('lr-annonce');\n      if (an) this.setState({ annonce: Object.assign({ actif: true, type: 'info', modele: null, titre: '', texte: '' }, JSON.parse(an)) });\n    } catch (e) {}\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.mesurer); clearTimeout(this._t); }\n\n  mesurer = () => this.setState({ large: window.innerWidth >= 900 });\n\n  sauver = (extra) => {\n    this.setState(extra, () => {\n      const s = this.state;\n      try {\n        localStorage.setItem('lr-admin', JSON.stringify({\n          prix: s.prix, delta: s.delta, envoyees: s.envoyees,\n          journal: s.journal, horaires: s.horaires, annonce: s.annonce,\n          identifiant: s.identifiant, motdepasse: s.motdepasse\n        }));\n      } catch (e) {}\n    });\n  };\n\n  toast = (m) => {\n    this.setState({ toast: m });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);\n  };\n\n  noter = (quoi, detail, couleur) => {\n    const e = { quoi, detail, couleur: couleur || C.vert, quand: dateFr(new Date()) };\n    this.setState(s => ({ journal: [e].concat(s.journal).slice(0, 60) }));\n  };\n\n  connecter = () => {\n    const id = this.state.champId.trim().toLowerCase();\n    if (!id || !this.state.champMdp) return this.setState({ erreur: 'Identifiant et mot de passe requis.' });\n    if (id !== this.state.identifiant.toLowerCase() || this.state.champMdp !== this.state.motdepasse)\n      return this.setState({ erreur: 'Identifiants incorrects.' });\n    this.setState({ session: true, erreur: '', champMdp: '' });\n  };\n\n  publierPrix = () => {\n    const b = this.state.brouillonsPrix;\n    const ids = Object.keys(b);\n    const prix = Object.assign({}, this.state.prix);\n    const delta = Object.assign({}, this.state.delta);\n    const notifs = [];\n    let n = 0;\n    ids.forEach(id => {\n      const v = parseFloat(String(b[id]).replace(',', '.'));\n      if (isNaN(v) || v === prix[id]) return;\n      const m = MATIERES.filter(x => x.id === id)[0];\n      const variation = Math.round((v - prix[id]) * 100) / 100;\n      delta[id] = variation;\n      prix[id] = Math.round(v * 100) / 100;\n      notifs.push({\n        cle: id + '-' + Date.now() + '-' + n, type: 'prix', matiere: m.court,\n        titre: m.court + ' : ' + eur(prix[id]) + ' €/kg',\n        corps: (variation > 0 ? '+ ' : '− ') + eur(Math.abs(variation)) + ' € · ancien prix ' + eur(prix[id] - variation) + ' €/kg',\n        nb: abonnes(id)\n      });\n      n++;\n    });\n    if (!n) { this.setState({ brouillonsPrix: {} }); return; }\n    this.sauver({ prix, delta, brouillonsPrix: {}, notifs: this.state.notifs.concat(notifs) });\n    this.noter(n + (n > 1 ? ' prix publiés' : ' prix publié'), notifs.map(x => x.titre).join(' · '), C.vert);\n    this.toast(n + (n > 1 ? ' notifications préparées' : ' notification préparée'));\n  };\n\n  envoyer = (b) => {\n    const env = { titre: b.titre, corps: b.corps, destinataires: b.nb + ' clients', quand: dateFr(new Date()) };\n    this.sauver({\n      notifs: this.state.notifs.filter(x => x.cle !== b.cle),\n      envoyees: [env].concat(this.state.envoyees).slice(0, 40)\n    });\n    this.noter('Notification envoyée', b.titre + ' → ' + b.nb + ' clients', '#8FE0BC');\n    this.toast('Envoyée à ' + b.nb + ' clients');\n  };\n\n  toutEnvoyer = () => {\n    const list = this.state.notifs;\n    if (!list.length) return;\n    const envs = list.map(b => ({ titre: b.titre, corps: b.corps, destinataires: b.nb + ' clients', quand: dateFr(new Date()) }));\n    this.sauver({ notifs: [], envoyees: envs.concat(this.state.envoyees).slice(0, 40) });\n    this.noter(list.length + ' notifications envoyées', list.map(x => x.titre).join(' · '), '#8FE0BC');\n    this.toast(list.length + ' notifications envoyées');\n  };\n\n  publierAnnonce = () => {\n    const a = this.state.annonce;\n    try { localStorage.setItem('lr-annonce', JSON.stringify(a)); } catch (e) {}\n    this.sauver({});\n    const mod = a.modele ? MODELES.filter(m => m.id === a.modele)[0] : null;\n    this.noter('Annonce publiée', mod ? mod.titre : (a.titre || 'Message libre'), TYPES.filter(t => t.id === a.type)[0].couleur);\n    this.toast('Annonce publiée dans l\\u2019app');\n  };\n\n  retirerAnnonce = () => {\n    try { localStorage.removeItem('lr-annonce'); } catch (e) {}\n    this.sauver({ annonce: { actif: false, type: 'info', modele: null, titre: '', texte: '' } });\n    this.noter('Annonce retirée', 'Plus aucun bandeau affiché', C.a500);\n    this.toast('Annonce retirée');\n  };\n\n  majAnnonce = (champs) => this.setState(s => ({ annonce: Object.assign({}, s.annonce, champs) }));\n\n  renderVals() {\n    const s = this.state;\n    const sec = SECTIONS.filter(x => x.id === s.section)[0] || SECTIONS[0];\n    const mod = s.annonce.modele ? MODELES
